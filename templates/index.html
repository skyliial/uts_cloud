<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produk Kami</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 50px; 
            text-align: center; 
        }
        .container { 
            max-width: 1200px; 
            margin: 0 auto; 
        }
        h1 { 
            font-size: 32px; 
            margin-bottom: 20px; 
        }
        .product { 
            display: inline-block; 
            width: 30%; 
            margin: 20px; 
            text-align: center; 
        }
        .product img { 
            max-width: 100%; 
            height: auto; 
            border-radius: 8px; 
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); 
        }
        .product-name { 
            font-size: 20px; 
            font-weight: bold; 
            margin-top: 10px; 
        }
        .product-price { 
            font-size: 20px; 
            color: blue; 
            margin-top: 10px; 
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Produk Kami</h1>
        <div class="product">
            <img src="https://storage.googleapis.com/ets-product-images/chitato%20lite.jpeg" alt="Chitato Lite">
            <div class="product-name">Chitato Lite</div>
            <div class="product-price">Rp 15.000</div>
        </div>
    </div>
</body>
</html>
